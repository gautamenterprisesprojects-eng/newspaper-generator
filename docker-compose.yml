services:
  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newspaper_generator
    restart: always
    # Hard ceiling so a runaway headless-Chromium burst gets OOM-killed inside
    # this cgroup instead of starving nginx/sshd on the whole 8 GB VPS (which
    # is exactly what happened on 2026-09-21 -- Cloudflare 522 on both sites).
    # The generator itself needs ~1 GB; the rest is headroom for one or two
    # NMS PDF renders (see NMS_PDF_MAX_CONCURRENCY in nmsPdfJob.ts).
    mem_limit: 5g
    memswap_limit: 5g
    ports:
      # Internal-only -- the host's own nginx (fronting the existing site)
      # reverse-proxies the public domain to this port. Not exposed publicly
      # here on purpose.
      - "127.0.0.1:3002:3000"
    environment:
      NEWSWIRE_API_BASE_URL: ${NEWSWIRE_API_BASE_URL:-https://api.gautamenterprises.org}
      NEWSWIRE_API_BASE_URLS: ${NEWSWIRE_API_BASE_URLS:-https://api.gautamenterprises.org}
      NEWSWIRE_API_KEY: ${NEWSWIRE_API_KEY:?NEWSWIRE_API_KEY must be set}
      NMS_BUNDLE_DIR: /app/data/nms-bundles
      NMS_GENERATED_PDF_DIR: /app/data/nms-generated-pdfs
      NMS_USED_BUNDLE_RETENTION_HOURS: ${NMS_USED_BUNDLE_RETENTION_HOURS:-1}
      NMS_GENERATED_PDF_RETENTION_HOURS: ${NMS_GENERATED_PDF_RETENTION_HOURS:-30}
      NODE_OPTIONS: --max-old-space-size=4096
      # cliffdemo3 only: server-side portal profile fetch for masthead city/volume
      PAGEMINT_PORTAL_API_BASE: ${PAGEMINT_PORTAL_API_BASE:-http://newspaper_api_server:8080/api/v1}
      PAGEMINT_PORTAL_JWT_SECRET: ${PAGEMINT_PORTAL_JWT_SECRET:?PAGEMINT_PORTAL_JWT_SECRET must be set}
      PAGEMINT_CLIFFDEMO3_PORTAL_PUBLISHER_ID: ${PAGEMINT_CLIFFDEMO3_PORTAL_PUBLISHER_ID:-91e4a212-5920-4cf5-b5a3-4aa39bdfca5b}
      PAGEMINT_CLIFFDEMO3_PORTAL_DEVICE_ID: ${PAGEMINT_CLIFFDEMO3_PORTAL_DEVICE_ID:-e0c54c5a-c2ae-4cd0-9194-8ad451b46c12}
    volumes:
      - ./data/nms-bundles:/app/data/nms-bundles
      - ./data/nms-generated-pdfs:/app/data/nms-generated-pdfs
    networks:
      - default
      - portal-tier

networks:
  default:
  portal-tier:
    external: true
    name: newspaper-portal_portal-tier
